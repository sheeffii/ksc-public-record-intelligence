name: Security and supply chain

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: python -m pip install -e apps/api -e workers/ingestion pip-audit
      - run: pip-audit
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high

  containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { service: api, dockerfile: apps/api/Dockerfile }
          - { service: web, dockerfile: apps/web/Dockerfile }
          - { service: worker, dockerfile: workers/ingestion/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ksc-${{ matrix.service }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_DATA_SOURCE=api
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ksc-${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
