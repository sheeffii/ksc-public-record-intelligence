# KSC Public Record Intelligence — local stack
#
#   cp .env.example .env
#   docker compose up --build
#
# Services: web (Next.js), api (FastAPI), postgres (pgvector), redis, minio.
# No court documents are fetched by any service.

name: ksc-pri

x-env: &env
  env_file:
    - .env

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ksc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ksc_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ksc}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ksc} -d ${POSTGRES_DB:-ksc}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ksc_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ksc_minio_dev_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot: create the documents bucket so /ready can verify object storage.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ksc_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ksc_minio_dev_password}
      MINIO_BUCKET_DOCUMENTS: ${MINIO_BUCKET_DOCUMENTS:-ksc-documents}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
        mc mb --ignore-existing \"local/$$MINIO_BUCKET_DOCUMENTS\" &&
        echo bucket ready
      "

  api:
    build:
      context: ./apps/api
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    <<: *env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ksc}:${POSTGRES_PASSWORD:-ksc_dev_password}@postgres:5432/${POSTGRES_DB:-ksc}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    <<: *env
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  postgres-data:
  minio-data:
